services:
  - type: web
    name: old-classic-club
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 100 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/oldclassic/club.sqlite3

