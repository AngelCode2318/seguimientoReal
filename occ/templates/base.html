<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#722b32">
  <meta name="description" content="El punto de encuentro de Old Classic Club. Comparte la ubicación de tu auto durante la rodada.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Old Classic Club · La rodada en vivo{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand.svg') }}">
  {% block styles %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="m5 7 2-4h10l2 4 2 3v8H3v-8l2-3Zm0 0h14M3 12h18M6 18v3m12-3v3"/><path d="M6 15h2m8 0h2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L20 5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-11v1"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M9 4H3v16h6m-1-8h13m-5-5 5 5-5 5"/></symbol>
  </defs></svg>
  {% block body %}{% endblock %}
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
